<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>One SQL tool vs. one tool per system: a demo</title>
    <meta name="description" content="Does an AI agent do better with one tool per system, or with one SQL tool over everything? Three arms, four fake systems of a fictional law firm, every run scored exactly.">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B1322" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
